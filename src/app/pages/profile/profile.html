<div
  class="profile-container"
  *ngIf="user"
>

  <div class="profile-card">

    <h1>User Profile</h1>

    <p>
      <strong>Name:</strong>
      {{ user.name }}
    </p>

    <p>
      <strong>Email:</strong>
      {{ user.email }}
    </p>

    <p>
      <strong>State:</strong>
      {{ user.state }}
    </p>

    <p>
      <strong>Role:</strong>
      {{ user.role }}
    </p>

  </div>

</div>
